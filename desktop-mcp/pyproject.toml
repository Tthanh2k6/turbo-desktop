[project]
name = "turbo-desktop-mcp"
version = "0.2.0"
description = "UIA-based MCP server for driving Windows desktop apps with compact snapshots and delta diffs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["mcp", "windows", "ui-automation", "desktop-automation", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=1.0.0",
    "Pillow>=10.0.0",
    'uiautomation>=2.0.18; sys_platform == "win32"',
    'pywin32>=306; sys_platform == "win32"',
    'winrt-runtime>=2.0.0; sys_platform == "win32"',
    'winrt-Windows.Foundation; sys_platform == "win32"',
    'winrt-Windows.Foundation.Collections; sys_platform == "win32"',
    'winrt-Windows.Globalization; sys_platform == "win32"',
    'winrt-Windows.Graphics.Imaging; sys_platform == "win32"',
    'winrt-Windows.Media.Ocr; sys_platform == "win32"',
    'winrt-Windows.Storage.Streams; sys_platform == "win32"',
]

[project.scripts]
turbo-desktop-mcp = "turbo_desktop.server:main"
turbo-desktop = "turbo_desktop.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["realinput: needs TURBO_DESKTOP_REAL_INPUT=1"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
turbo_desktop = ["rules/*.toml"]
