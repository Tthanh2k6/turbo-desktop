name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      TURBO_DESKTOP_NO_INPUT: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Compile C# WinForms test fixtures
        shell: pwsh
        run: ./desktop-mcp/tests/fixtures/build.ps1

      - name: Install desktop-mcp and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./desktop-mcp pytest

      - name: Run desktop-mcp tests
        run: pytest desktop-mcp/tests -q

      - name: Run relay tests
        run: pytest relay/tests -q
